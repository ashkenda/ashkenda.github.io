  summary: I am a masters student in the Bridge Lab at Michigan State University pursuing a degree in Fisheries & Widlife with a specialization in Ecology, Evolution, & Behavior. My current research utilizes machine learning and national scale datasets to predict risk of microcystin toxins across U.S. lakes in both the present and future.

