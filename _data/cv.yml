      - company: Bridge Lab at Michigan State University
        position: Graduate Research Assistant
        location: East Lansing, MI
        url: https://bridgelabresearch.org/
        start_date: 2025
        end_date: 2027
        summary: Conducting large-scale data analysis on U.S. lakes using the NLA, LAGOS, and CMIP6 databases
        highlights:
          - Using machine learning to analyze the drivers of cyanobacteria microcystin production across thousands of lakes in the present day and under future climate change scenarios
          - Analyzing cyanobacteria community composition and functional traits using redundancy analysis
          - Compiling, processing, and QA/QC'd large amounts of data using RStudio and cloud computing
          - Assisting with additional lab projects including analyzing the relationship between lake sampling efforts and community demographics

      - company: University of Michigan Biological Station
        position: Field Technician
        location: Pellston, MI
        date: "Summer 2024"
        summary: Assisted visiting researchers with projects at the station
        highlights:
          - Assembled mesocosm plot for ant colony research with Dr. J. P. Lessard
          - Captured bumble bees for population surveys and collected strawberries for chemical analysis
          - Digitized data archive and herbarium specimens
          - Mapped field sites on station property on ArcGIS

      - company: Duffy Lab at University of Michigan
        position: Undergraduate Research Assistant
        location: Ann Arbor, MI
        url: https://duffylab.wordpress.com/
        start_date: 2023
        end_date: 2024
        summary: Examined relationships and complex interactions between fungal and microsporidian parasites of Daphnia
        highlights:
          - Sampled and analyzed local lakes using YSI multiparameter probe, fluorometer, Secchi disk, and zooplankton nets
          - Assisted with and conducted various research projects
          - Maintained Daphnia and parasite colonies, filtered lake water, ran genetic analyses

      - company: Rouf Lab at Michigan Medicine
